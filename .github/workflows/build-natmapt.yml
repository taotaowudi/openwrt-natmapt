name: Build Natmapt for OpenWrt 25.12.5 (Optimized)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file curl zstd qemu-utils ccache
          
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Download OpenWrt 25.12.5 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$SDK_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::SDK download failed with HTTP $HTTP_CODE."
            exit 1
          fi

          curl -fSL --progress-bar "$SDK_URL" -o sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          
          EXTRACTED_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -n1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::Failed to find extracted SDK directory!"
            ls -la
            exit 1
          fi
          echo "SDK_DIR=$EXTRACTED_DIR" >> $GITHUB_ENV

      - name: Restore Feeds & Ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_DIR }}/feeds
            ${{ env.SDK_DIR }}/dl
            ~/.ccache
          key: openwrt-25.12.5-x86-64-feeds-${{ hashFiles('**/Makefile', '**/patches/**') }}
          restore-keys: |
            openwrt-25.12.5-x86-64-feeds-

      - name: Configure feeds and package
        run: |
          cd "${{ env.SDK_DIR }}"
          
          # 替换为正式 release 源
          sed -i 's|https://downloads.openwrt.org/snapshots/|https://downloads.openwrt.org/releases/25.12.5/|g' feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # ✅ 克隆 natmapt 源码到 SDK package 目录
          git clone https://github.com/taotaowudi/openwrt-natmapt.git package/openwrt-natmapt
          
          make defconfig
          
          # 🚀 动态检测包名并写入配置，避免硬编码导致 No rule to make target
          PKG_NAME=$(grep -E "^define Package/" package/openwrt-natmapt/Makefile 2>/dev/null | head -n1 | awk '{print $3}')
          if [ -z "$PKG_NAME" ]; then
            echo "::error::Cannot detect package name from Makefile! Please verify the repository structure."
            cat package/openwrt-natmapt/Makefile
            exit 1
          fi
          echo "Detected package name: $PKG_NAME"
          echo "CONFIG_PACKAGE_${PKG_NAME}=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          
          # 验证包是否被成功选中
          if ! grep -q "CONFIG_PACKAGE_${PKG_NAME}=y" .config; then
            echo "::error::Package ${PKG_NAME} was not selected in .config!"
            exit 1
          fi
          echo "✅ Package ${PKG_NAME} successfully registered."
          echo "PKG_NAME=${PKG_NAME}" >> $GITHUB_ENV

      - name: Compile natmapt
        run: |
          cd "${{ env.SDK_DIR }}"
          make package/${{ env.PKG_NAME }}/compile -j$(nproc)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natmapt-openwrt-25.12.5-x86_64
          path: |
            ${{ env.SDK_DIR }}/bin/packages/x86_64/base/*natmapt*.apk
            ${{ env.SDK_DIR }}/bin/packages/x86_64/base/libmbedtls*.apk
            ${{ env.SDK_DIR }}/bin/packages/x86_64/base/libjson-c*.apk
          retention-days: 7
          if-no-files-found: error
