name: Build Natmapt for OpenWrt 25.12.5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file curl zstd qemu-utils ccache bash jq
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Download OpenWrt 25.12.5 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          curl -fSL --progress-bar "$SDK_URL" -o sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          EXTRACTED_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -n1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::SDK extraction failed!"
            exit 1
          fi
          echo "SDK_DIR=$EXTRACTED_DIR" >> $GITHUB_ENV

      - name: Restore Feeds & Ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_DIR }}/feeds
            ${{ env.SDK_DIR }}/dl
            ~/.ccache
          key: openwrt-25.12.5-x86-64-natmapt-${{ hashFiles('**/Makefile') }}
          restore-keys: openwrt-25.12.5-x86-64-natmapt-

      - name: Configure and Build natmapt
        run: |
          cd "${{ env.SDK_DIR }}"
          
          # 切换到正式 release 源
          sed -i 's|https://downloads.openwrt.org/snapshots/|https://downloads.openwrt.org/releases/25.12.5/|g' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # ✅ 克隆到固定目录名，后续所有命令都基于此目录名
          PKG_DIR="openwrt-natmapt"
          git clone https://github.com/taotaowudi/openwrt-natmapt.git "package/${PKG_DIR}"

          # 验证 Makefile 存在
          if [ ! -f "package/${PKG_DIR}/Makefile" ]; then
            echo "::error::Makefile not found in package/${PKG_DIR}/"
            ls -la "package/${PKG_DIR}/" || true
            exit 1
          fi

          make defconfig
          
          # 启用主包及所有子包
          cat >> .config <<EOF
          CONFIG_PACKAGE_natmapt=y
          CONFIG_PACKAGE_natmapt-client-script-transmission=y
          CONFIG_PACKAGE_natmapt-client-script-deluge=y
          CONFIG_PACKAGE_natmapt-notify-script-pushbullet=y
          CONFIG_PACKAGE_natmapt-notify-script-pushover=y
          CONFIG_PACKAGE_natmapt-notify-script-telegram=y
          CONFIG_CCACHE=y
          EOF
          
          make defconfig

          # ✅ 关键修复：使用目录名而非包名作为编译目标
          echo "🔨 Compiling package/${PKG_DIR} ..."
          make "package/${PKG_DIR}/compile" -j$(nproc) V=s

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natmapt-openwrt-25.12.5-x86_64
          path: |
            ${{ env.SDK_DIR }}/bin/packages/x86_64/base/natmapt*.apk
          retention-days: 7
          if-no-files-found: error
