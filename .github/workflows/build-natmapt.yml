name: Build natmapt for OpenWrt 25.12

on:
  workflow_dispatch: # 允许手动触发
  push:
    paths:
      - '.github/workflows/build-natmapt.yml'

env:
  OPENWRT_VERSION: "25.12-SNAPSHOT"
  TARGET: "x86_64"       # ← 根据你的目标设备修改，如 aarch64_generic, mipsel_24kc 等
  PACKAGE_NAME: "natmapt"
  REPO_URL: "https://github.com/taotaowudi/openwrt-natmapt.git"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Download OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/generic/"
          SDK_FILE=$(curl -sL "$SDK_URL" | grep -oP 'openwrt-sdk-[^\"]+\.tar\.xz' | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::未找到对应 SDK，请检查 OPENWRT_VERSION 和 TARGET 是否正确"
            exit 1
          fi
          echo "Downloading $SDK_FILE ..."
          wget -q "${SDK_URL}${SDK_FILE}"
          tar xf "$SDK_FILE"
          mv openwrt-sdk-* sdk

      - name: Clone natmapt source
        run: |
          cd sdk
          git clone --depth 1 --branch master --single-branch \
            ${{ env.REPO_URL }} package/natmapt

      - name: Configure & Compile
        run: |
          cd sdk
          make defconfig
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 启用 natmapt 模块编译
          sed -i 's/^# CONFIG_PACKAGE_natmapt is not set/CONFIG_PACKAGE_natmapt=m/' .config
          make package/natmapt/compile V=99 -j$(nproc)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: natmapt-apk-${{ env.TARGET }}
          path: sdk/bin/packages/*/base/natmapt-*.apk
          retention-days: 7
