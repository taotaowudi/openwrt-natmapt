name: Build and Release Natmapt for OpenWrt 25.12.5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# ⚠️ 必须添加此权限，否则无法创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file curl zstd qemu-utils ccache bash jq
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Download OpenWrt 25.12.5 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          curl -fSL --progress-bar "$SDK_URL" -o sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          EXTRACTED_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -n1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::SDK extraction failed!"
            exit 1
          fi
          echo "SDK_DIR=$EXTRACTED_DIR" >> $GITHUB_ENV

      - name: Restore Feeds & Ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_DIR }}/feeds
            ${{ env.SDK_DIR }}/dl
            ~/.ccache
          key: openwrt-25.12.5-x86-64-natmapt-${{ hashFiles('**/Makefile') }}
          restore-keys: openwrt-25.12.5-x86-64-natmapt-

      - name: Configure and Build natmapt
        run: |
          cd "${{ env.SDK_DIR }}"
          
          sed -i 's|https://downloads.openwrt.org/snapshots/|https://downloads.openwrt.org/releases/25.12.5/|g' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          PKG_DIR="openwrt-natmapt"
          git clone https://github.com/taotaowudi/openwrt-natmapt.git "package/${PKG_DIR}"

          if [ ! -f "package/${PKG_DIR}/Makefile" ]; then
            echo "::error::Makefile not found in package/${PKG_DIR}/"
            exit 1
          fi

          make defconfig
          cat >> .config <<EOF
          CONFIG_PACKAGE_natmapt=y
          CONFIG_PACKAGE_natmapt-client-script-transmission=y
          CONFIG_PACKAGE_natmapt-client-script-deluge=y
          CONFIG_PACKAGE_natmapt-notify-script-pushbullet=y
          CONFIG_PACKAGE_natmapt-notify-script-pushover=y
          CONFIG_PACKAGE_natmapt-notify-script-telegram=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

          echo "🔨 Compiling package/${PKG_DIR} ..."
          make "package/${PKG_DIR}/compile" -j$(nproc) V=s

      # ========== 以下为新增的 Release 发布步骤 ==========

      - name: Generate Release Tag
        id: tag
        run: |
          # 使用 日期-短commit号 作为唯一版本号，避免冲突
          TAG="v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "🏷️ Release tag: ${TAG}"

      - name: Collect APK Artifacts
        run: |
          mkdir -p release_assets
          find "${{ env.SDK_DIR }}/bin/packages/x86_64/base/" -name "natmapt*.apk" -exec cp {} release_assets/ \;
          
          echo "📦 Collected files:"
          ls -lh release_assets/
          
          FILE_COUNT=$(ls -1 release_assets/*.apk 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No APK files found for release!"
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Natmapt OpenWrt 25.12.5 x86_64 (${{ steps.tag.outputs.tag }})
          body: |
            ## 📦 Natmapt for OpenWrt 25.12.5 (x86_64)
            
            - **OpenWrt Version**: 25.12.5
            - **Architecture**: x86_64
            - **Package Format**: APK
            - **Build Commit**: `${{ github.sha }}`
            
            ### 📋 Included Packages
            - `natmapt` (主程序)
            - `natmapt-client-script-transmission`
            - `natmapt-client-script-deluge`
            - `natmapt-notify-script-pushbullet`
            - `natmapt-notify-script-pushover`
            - `natmapt-notify-script-telegram`
            
            ### 🚀 Installation
            ```bash
            # 上传到路由器后执行
            apk add --allow-untrusted natmapt-*.apk

            ```
          files: release_assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
