name: Build and Release Natmapt for OpenWrt 25.12.5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: openwrt-sdk-*
          key: openwrt-sdk-25.12.5-x86-64-v1

      - name: Download OpenWrt 25.12.5 SDK (if not cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          curl -fSL --progress-bar "$SDK_URL" -o sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          rm -f sdk.tar.zst

      # ✅ 修复：将 SDK 绝对路径写入固定文件，彻底避免通配符解析问题
      - name: Set SDK Directory
        run: |
          SDK_DIR=$(realpath $(ls -d openwrt-sdk-* | head -n1))
          echo "$SDK_DIR" > /tmp/sdk_path.txt
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "📂 SDK path resolved to: $SDK_DIR"

      - name: Prepare build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            curl zstd ccache bash jq > /dev/null 2>&1
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ~/.ccache
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK_DIR }}/feeds
            ${{ env.SDK_DIR }}/dl
            ~/.ccache
          key: openwrt-build-cache-25.12.5-${{ hashFiles('**/Makefile') }}
          restore-keys: openwrt-build-cache-25.12.5-

      - name: Configure and Build natmapt
        run: |
          cd "${{ env.SDK_DIR }}"
          
          if [ ! -d "feeds/packages" ]; then
            sed -i 's|https://downloads.openwrt.org/snapshots/|https://downloads.openwrt.org/releases/25.12.5/|g' feeds.conf.default
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          fi

          PKG_DIR="openwrt-natmapt"
          if [ ! -d "package/${PKG_DIR}" ]; then
            git clone --depth=1 https://github.com/taotaowudi/openwrt-natmapt.git "package/${PKG_DIR}"
          fi

          make defconfig
          cat >> .config <<EOF
          CONFIG_PACKAGE_natmapt=y
          CONFIG_PACKAGE_natmapt-client-script-transmission=y
          CONFIG_PACKAGE_natmapt-client-script-deluge=y
          CONFIG_PACKAGE_natmapt-notify-script-pushbullet=y
          CONFIG_PACKAGE_natmapt-notify-script-pushover=y
          CONFIG_PACKAGE_natmapt-notify-script-telegram=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

          echo "🔨 Compiling package/${PKG_DIR} ..."
          make "package/${PKG_DIR}/compile" -j$(nproc) V=s

      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ✅ 修复：从固定文件读取路径，不再使用 env 变量拼接通配符
      - name: Collect APK Artifacts
        run: |
          SDK_DIR=$(cat /tmp/sdk_path.txt)
          BASE_DIR="${SDK_DIR}/bin/packages/x86_64/base"
          
          echo "🔍 Searching in: $BASE_DIR"
          ls -la "$BASE_DIR" || { echo "::error::Base dir not found!"; exit 1; }
          
          mkdir -p release_assets
          find "$BASE_DIR" -maxdepth 1 -name "natmapt*.apk" -exec cp {} release_assets/ \;
          
          echo "📦 Collected files:"
          ls -lh release_assets/
          
          FILE_COUNT=$(ls -1 release_assets/*.apk 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No APK files found!"
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Natmapt OpenWrt 25.12.5 x86_64 (${{ steps.tag.outputs.tag }})
          body: |
            ## 📦 Natmapt for OpenWrt 25.12.5 (x86_64)
            - **OpenWrt**: 25.12.5 | **Arch**: x86_64 | **Format**: APK
            - **Build**: `${{ github.sha }}`
            
            ### 🚀 Install
            ```bash
            apk add --allow-untrusted natmapt-*.apk

            ```
          files: release_assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
