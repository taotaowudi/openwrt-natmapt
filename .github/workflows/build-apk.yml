name: Build OpenWrt APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.sdk_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_url: https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-setuptools \
            rsync subversion swig time unzip wget xsltproc zlib1g-dev zstd

      # ---------- 缓存 1: 下载好的 SDK 压缩包 ----------
      - name: Cache SDK tarball
        id: cache-sdk-tarball
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-tarball-${{ matrix.sdk_arch }}-25.12.0

      - name: Download OpenWrt SDK
        if: steps.cache-sdk-tarball.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ matrix.sdk_url }}" -O sdk.tar.zst

      - name: Extract SDK
        run: |
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      # ---------- 缓存 2: feeds (dl 目录) ----------
      - name: Cache feeds
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: feeds-${{ matrix.sdk_arch }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            feeds-${{ matrix.sdk_arch }}-

      # ---------- 缓存 3: ccache 编译缓存 ----------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.sdk_arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.sdk_arch }}-

      - name: Prepare SDK feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package into SDK
        run: |
          rm -rf sdk/package/natmapt
          mkdir -p sdk/package/natmapt
          rsync -av --exclude='.git' --exclude='sdk' ./ sdk/package/natmapt/

      - name: Generate dummy APK signing keys
        working-directory: sdk
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true

      - name: Configure package
        working-directory: sdk
        run: |
          make defconfig
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_PACKAGE_natmapt=m" >> .config
          # 启用 ccache
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig

      - name: Build package
        working-directory: sdk
        run: |
          export CCACHE_DIR=$HOME/.ccache
          make package/natmapt/compile V=s -j$(nproc) 2>&1 | tee build.log

      - name: ccache stats
        run: ccache --show-stats

      - name: Collect APK files
        run: |
          mkdir -p artifacts
          find sdk/bin -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.sdk_arch }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.sdk_arch }}
          path: sdk/build.log

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
